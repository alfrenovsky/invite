<!-- Left Typography Color & Glow Picker Panel (Starts Minimized) -->
<aside class="typography-color-panel is-minimized" id="typographyColorPanel" aria-label="Selector de Color y Glow de Tipografía">
    <div class="tcp-header" id="tcpHeader">
        <div class="tcp-title">
            <span class="tcp-icon">🎨</span>
            <span class="tcp-heading-text">Tipografía & Glow</span>
        </div>
        <button class="tcp-toggle-btn" id="btnToggleTcp" title="Minimizar / Expandir" type="button">🎨</button>
    </div>

    <div class="tcp-body" id="tcpBody">
        <!-- 1. SLIDE TAG SECTION (No Glow) -->
        <div class="tcp-section">
            <div class="tcp-section-title">
                <span class="tcp-element-name">Tag / Etiqueta</span>
                <span class="tcp-target-class">.slide-tag</span>
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="pickerSlideTag">Color Texto:</label>
                <div class="tcp-input-row">
                    <input type="color" class="tcp-color-input" id="pickerSlideTag" value="#ffffff">
                    <input type="text" class="tcp-hex-input" id="hexSlideTag" value="#ffffff" maxlength="7" spellcheck="false">
                </div>
            </div>

            <div class="tcp-slider-row">
                <div class="tcp-slider-header">
                    <span class="tcp-sublabel">Tamaño:</span>
                    <span class="tcp-slider-val" id="valSlideTagSize">0.76em</span>
                </div>
                <input type="range" class="tcp-slider" id="sliderSlideTagSize" min="0.50" max="1.50" step="0.02" value="0.76">
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="selectSlideTagFont">Fuente:</label>
                <div class="tcp-font-picker" data-section="tag">
                    <button type="button" class="tcp-font-trigger" id="triggerSlideTagFont" aria-label="Elegir fuente de tag">
                        <span class="tcp-font-name" id="nameSlideTagFont">Syncopate</span>
                        <span class="tcp-font-arrow">▾</span>
                    </button>
                    <select class="tcp-select-hidden" id="selectSlideTagFont">
                        <option value="syncopate" selected>Syncopate</option>
                        <option value="montserrat">Montserrat</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 2. SLIDE TITLE SECTION (With Glow Controls) -->
        <div class="tcp-section">
            <div class="tcp-section-title">
                <span class="tcp-element-name">Título</span>
                <span class="tcp-target-class">.slide-title</span>
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="pickerSlideTitle">Color Texto:</label>
                <div class="tcp-input-row">
                    <input type="color" class="tcp-color-input" id="pickerSlideTitle" value="#80c3ff">
                    <input type="text" class="tcp-hex-input" id="hexSlideTitle" value="#80c3ff" maxlength="7" spellcheck="false">
                </div>
            </div>

            <div class="tcp-slider-row">
                <div class="tcp-slider-header">
                    <span class="tcp-sublabel">Tamaño:</span>
                    <span class="tcp-slider-val" id="valSlideTitleSize">1.95em</span>
                </div>
                <input type="range" class="tcp-slider" id="sliderSlideTitleSize" min="1.00" max="3.20" step="0.05" value="1.95">
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="pickerSlideTitleGlow">Color Glow:</label>
                <div class="tcp-input-row">
                    <input type="color" class="tcp-color-input" id="pickerSlideTitleGlow" value="#0088ff">
                    <input type="text" class="tcp-hex-input" id="hexSlideTitleGlow" value="#0088ff" maxlength="7" spellcheck="false">
                </div>
            </div>

            <div class="tcp-slider-row">
                <div class="tcp-slider-header">
                    <span class="tcp-sublabel">Radio Glow:</span>
                    <span class="tcp-slider-val" id="valSlideTitleRadius">17px</span>
                </div>
                <input type="range" class="tcp-slider" id="sliderSlideTitleRadius" min="0" max="40" step="1" value="17">
            </div>

            <div class="tcp-slider-row">
                <div class="tcp-slider-header">
                    <span class="tcp-sublabel">Opacidad Glow:</span>
                    <span class="tcp-slider-val" id="valSlideTitleOpacity">100%</span>
                </div>
                <input type="range" class="tcp-slider" id="sliderSlideTitleOpacity" min="0" max="100" step="5" value="100">
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="selectSlideTitleFont">Fuente:</label>
                <div class="tcp-font-picker" data-section="title">
                    <button type="button" class="tcp-font-trigger" id="triggerSlideTitleFont" aria-label="Elegir fuente de título">
                        <span class="tcp-font-name" id="nameSlideTitleFont">Syncopate</span>
                        <span class="tcp-font-arrow">▾</span>
                    </button>
                    <select class="tcp-select-hidden" id="selectSlideTitleFont">
                        <option value="syncopate" selected>Syncopate</option>
                        <option value="montserrat">Montserrat</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. SLIDE DESCRIPTION SECTION (No Glow + Font Selector) -->
        <div class="tcp-section">
            <div class="tcp-section-title">
                <span class="tcp-element-name">Descripción</span>
                <span class="tcp-target-class">.slide-desc</span>
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="pickerSlideDesc">Color Texto:</label>
                <div class="tcp-input-row">
                    <input type="color" class="tcp-color-input" id="pickerSlideDesc" value="#b8deff">
                    <input type="text" class="tcp-hex-input" id="hexSlideDesc" value="#B8DEFF" maxlength="7" spellcheck="false">
                </div>
            </div>

            <div class="tcp-slider-row">
                <div class="tcp-slider-header">
                    <span class="tcp-sublabel">Tamaño:</span>
                    <span class="tcp-slider-val" id="valSlideDescSize">1.20em</span>
                </div>
                <input type="range" class="tcp-slider" id="sliderSlideDescSize" min="0.70" max="2.20" step="0.05" value="1.20">
            </div>

            <div class="tcp-row">
                <label class="tcp-sublabel" for="selectSlideDescFont">Fuente:</label>
                <div class="tcp-font-picker" data-section="desc">
                    <button type="button" class="tcp-font-trigger" id="triggerSlideDescFont" aria-label="Elegir fuente de descripción">
                        <span class="tcp-font-name" id="nameSlideDescFont">Montserrat</span>
                        <span class="tcp-font-arrow">▾</span>
                    </button>
                    <select class="tcp-select-hidden" id="selectSlideDescFont">
                        <option value="montserrat" selected>Montserrat</option>
                        <option value="syncopate">Syncopate</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="tcp-actions">
            <button class="tcp-btn" id="btnResetTcp" type="button" title="Restablecer">↺ Reset</button>
            <button class="tcp-btn tcp-btn-primary" id="btnCopyTcpCss" type="button" title="Copiar bloque CSS">📋 Copiar CSS</button>
        </div>
    </div>
</aside>
