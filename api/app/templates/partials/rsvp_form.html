<div class="interactive-content rsvp-form-container">
    <form id="storyRsvpForm">
        <input type="hidden" id="form_invitacion_id" value="{{ invitacion_id }}">
        
        <div id="rsvpCardsContainer" class="rsvp-guest-list">
            {% for guest in guests %}
            {% set conf = guest.confirmacion or '' %}
            <div class="rsvp-guest-row" data-guest-id="{{ guest.id }}" data-status="{{ conf }}" tabindex="0" role="button" aria-label="Confirmación de {% if guest.nombre or guest.apellido %}{{ guest.nombre }} {{ guest.apellido }}{% else %}Invitado{% endif %}">
                <span class="rsvp-bullet {% if conf == 'si' %}bullet-si{% elif conf == 'no' %}bullet-no{% else %}bullet-pending{% endif %}" id="bullet_{{ guest.id }}"></span>
                <span class="rsvp-guest-name">{% if guest.nombre or guest.apellido %}{{ guest.nombre }} {{ guest.apellido }}{% else %}Invitado{% endif %}</span>
            </div>
            {% endfor %}
        </div>

        <div class="autosave-status" id="autoSaveStatus" style="margin-top: 14px;">
            <span class="autosave-icon" id="autoSaveIcon">✓</span>
            <span class="autosave-text" id="autoSaveText">Respuestas guardadas</span>
        </div>
    </form>
</div>
