<!-- Pull to Refresh Indicator for Mobile -->
<div id="pullToRefreshIndicator" class="pull-to-refresh">
    <div class="ptr-spinner">
        <svg class="ptr-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
        <div class="ptr-loading-circle"></div>
    </div>
    <span class="ptr-label" id="ptrLabel">Deslizá para recargar</span>
</div>
