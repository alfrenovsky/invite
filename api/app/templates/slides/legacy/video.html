<!-- SLIDE: Video Intro -->
<div class="story-slide video-slide" data-slide-id="video" data-duration="{{ slide.duration or 10000 }}" style="padding: 0; overflow: hidden; background: #000;">
    <video class="story-video-bg" playsinline webkit-playsinline muted autoplay preload="auto">
        {% if slide.background %}
            <source src="/assets/backgrounds/{{ slide.background }}" type="{{ 'video/webm' if slide.background.lower().endswith('.webm') else ('video/quicktime' if slide.background.lower().endswith('.mov') else 'video/mp4') }}">
        {% else %}
            <source src="/assets/intro.mp4" type="video/mp4">
        {% endif %}
    </video>

    <div class="slide-body" style="padding: 0; pointer-events: none;"></div>
</div>
