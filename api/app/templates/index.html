<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Celia y Alfredo - Nuestra Boda</title>

    <meta property="og:title" content="Nos casamos"/>
    <meta property="og:site_name" content="Nuestra Boda" />
    <meta property="og:description" content="El 19 de marzo"/>
    <meta property="og:url" content="https://cya.beework.com.ar"/>
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/static/whatsapp.thumb.jpg"/>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 60px 20px;
        }
        h1 {
            font-size: 2.8em;
            margin: 0 0 10px 0;
            font-weight: 300;
        }
        p.subtitle {
            font-size: 1.3em;
            margin: 0;
            opacity: 0.9;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
        }
        .btn-primary:hover {
            background-color: #219150;
        }
        .btn-secondary {
            background-color: #2980b9;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #1f6391;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Celia & Alfredo</h1>
        <p class="subtitle">¡Nos casamos! — 19 de Marzo</p>
    </header>

    <div class="container">
        <div class="nav-buttons">
            <a href="/form" class="btn btn-primary">✍️ Confirmar Asistencia</a>
            <a href="/invitados-view" class="btn btn-secondary">📋 Lista de Invitados ({{ count }})</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">{{ count }}</div>
                <div class="stat-label">Total Registrados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" style="color: #27ae60;">{{ confirmados }}</div>
                <div class="stat-label">Confirmados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" style="color: #e74c3c;">{{ rechazados }}</div>
                <div class="stat-label">No Asisten</div>
            </div>
        </div>
    </div>

</body>
</html>
