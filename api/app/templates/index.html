<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Celia & Alfredo — Nuestra Boda</title>

    <!-- Heart Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">

    <!-- Open Graph / WhatsApp Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Celia & Alfredo" />
    <meta property="og:title" content="Nos casamos — Celia y Alfredo" />
    <meta property="og:description" content="19 de Marzo de 2027 — ¡Queremos compartir este día tan especial con vos!" />
    <meta property="og:url" content="{{ invitation_url or 'https://nos.vamos.acas.ar' }}" />
    <meta property="og:image" content="{{ (invitation_url.split('/i/')[0] if invitation_url else 'https://nos.vamos.acas.ar') }}/assets/whatsapp.thumb.jpeg" />
    <meta property="og:image:secure_url" content="{{ (invitation_url.split('/i/')[0] if invitation_url else 'https://nos.vamos.acas.ar') }}/assets/whatsapp.thumb.jpeg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Invitación de Boda Celia y Alfredo" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nos casamos — Celia y Alfredo" />
    <meta name="twitter:description" content="19 de Marzo de 2027 — ¡Queremos compartir este día tan especial con vos!" />
    <meta name="twitter:image" content="{{ (invitation_url.split('/i/')[0] if invitation_url else 'https://nos.vamos.acas.ar') }}/assets/whatsapp.thumb.jpeg" />


    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <!-- Story Stylesheet (no-cache with auto-versioning) -->
    <link rel="stylesheet" href="/assets/css/story.css?v={{ config_version }}">
</head>

<body>
    {% include "partials/pull_to_refresh.html" %}

    <div class="stories-wrapper">
        <!-- Desktop Navigation Arrows -->
        <button class="desktop-arrow desktop-prev" id="btnDesktopPrev" aria-label="Anterior">‹</button>
        <button class="desktop-arrow desktop-next" id="btnDesktopNext" aria-label="Siguiente">›</button>

        <div class="story-container" id="storyContainer" data-token="{{ token }}" data-invite-url="{{ invitation_url }}">
            {% include "partials/top_bar.html" %}
            {% include "partials/tap_zones.html" %}

            <!-- Slide Deck (Instant First Paint SSR) -->
            <div class="story-slides" id="storySlides">
                {% for slide in active_slides %}
                    {% include slide.template %}
                {% endfor %}
            </div>
        </div>
    </div>

    {% include "partials/toast.html" %}

    <!-- Story Client Script (no-cache with auto-versioning) -->
    <script src="/assets/js/story.js?v={{ config_version }}" defer></script>
</body>
</html>
