services:
  web:
    image: nginx:latest
    env_file:
      - project.env
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always

  api:
    build: ./api
    env_file:
      - project.env
    volumes:
      - ./secrets/credentials.json:/secrets/credentials.json:ro
    restart: always

