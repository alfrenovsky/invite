limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    root /usr/share/nginx/html;

    # Serve static assets directly from Nginx (no-cache for development)
    location /static/ {
        alias /usr/share/nginx/html/;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location /assets/fonts/ {
        alias /data/fonts/;
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location /assets/backgrounds/ {
        alias /data/backgrounds/;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /assets/avatar.jpeg {
        alias /data/avatar.jpeg;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    }

    location = /assets/avatar.png {
        alias /data/avatar.png;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /whatsapp.thumb.jpeg {
        alias /data/whatsapp.thumb.jpeg;
    }

    location = /whatsapp.thumb.jpg {
        alias /data/whatsapp.thumb.jpeg;
    }


    location = /favicon.svg {
        try_files /assets/favicon.svg /favicon.svg =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico {
        try_files /assets/favicon.svg /favicon.svg =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy dynamic page routes (SSR) & API requests to Flask
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


