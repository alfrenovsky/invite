limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Serve static assets directly from Nginx
    location /static/ {
        alias /usr/share/nginx/html/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /whatsapp.thumb.jpg {
        try_files /assets/whatsapp.thumb.jpg /whatsapp.thumb.jpg =404;
    }

    location = /favicon.svg {
        try_files /assets/favicon.svg /favicon.svg =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /favicon.ico {
        try_files /assets/favicon.svg /favicon.svg =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy dynamic page routes (SSR) & API requests to Flask
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


